<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#2563EB"/>
<title>Life Command Centre — Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#FAFAFA;color:#18181B;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:24px;padding:40px 32px;text-align:center;max-width:360px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);}
  .icon{font-size:56px;margin-bottom:16px;}
  h1{font-size:22px;font-weight:700;margin-bottom:8px;}
  p{color:#71717A;font-size:15px;line-height:1.5;margin-bottom:24px;}
  button{background:#2563EB;color:#fff;border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  button:active{opacity:.85;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>Life Command Centre needs a connection to sync. Your local data is safe — reconnect to continue.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>

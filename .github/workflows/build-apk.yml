name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - 'manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo '{
            "jdkPath": "${{ env.JAVA_HOME }}",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }' > ~/.bubblewrap/config.json
          # Use actual env vars
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          SDK_PATH=$ANDROID_SDK_ROOT
          echo "{\"jdkPath\": \"$JAVA_PATH\", \"androidSdkPath\": \"$SDK_PATH\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate keystore (debug signing)
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Life Command Centre, OU=App, O=DrNimish, L=Mumbai, S=MH, C=IN" \
            -storepass android \
            -keypass android

      - name: Build APK with Bubblewrap
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --manifest ./twa-manifest.json \
            --keyPath ./android.keystore \
            --keyAlias android \
            --keyPassword android \
            --keystorePassword android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeCommandCentre-APK
          path: |
            app-release-signed.apk
            app-release-unsigned.apk
            *.apk
          retention-days: 30
          if-no-files-found: warn

      - name: List build outputs
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20

name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 6 */3 * *'  # every 3 days at 06:00 UTC (well within 7-day pause window)
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://himfurxmsiemhqzhsqpm.supabase.co/rest/v1/lcc_data?select=id&limit=1")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Supabase is alive."
          else
            echo "Unexpected status $STATUS — project may be paused."
            exit 1
          fi
